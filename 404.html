<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Page Not Found | Lotus Media</title>
  <meta name="description" content="The page you are looking for does not exist. Return to Lotus Media homepage.">
  <link rel="icon" type="image/svg+xml" href="assets/brand/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .error-page-wrapper {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 40px 24px;
      background: radial-gradient(circle at 50% 30%, rgba(0, 148, 76, 0.05) 0%, transparent 70%),
                  radial-gradient(circle at 80% 80%, rgba(237, 46, 98, 0.05) 0%, transparent 60%),
                  #FFFFFF;
    }
    .error-code {
      font-family: var(--font-display);
      font-size: clamp(5rem, 15vw, 10rem);
      font-weight: 700;
      line-height: 1;
      letter-spacing: -0.04em;
      color: var(--brand-dark);
      margin-bottom: 8px;
    }
    .error-code span {
      color: var(--brand-rose);
    }
    .error-title {
      font-family: var(--font-display);
      font-size: clamp(1.5rem, 3vw, 2.25rem);
      font-weight: 700;
      letter-spacing: -0.025em;
      color: var(--brand-dark);
      margin-bottom: 16px;
    }
    .error-desc {
      font-family: var(--font-body);
      font-size: 1.0625rem;
      font-weight: 400;
      letter-spacing: -0.01em;
      color: var(--text-secondary);
      max-width: 480px;
      margin-bottom: 32px;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div class="error-page-wrapper">
    <a href="index.html" style="margin-bottom: 32px;">
      <img src="assets/brand/lotus-media-logo.png" alt="Lotus Media" style="height: 52px; width: auto;">
    </a>

    <div class="error-code">4<span>0</span>4</div>
    <h1 class="error-title">Frame Lost in Translation</h1>
    <p class="error-desc">
      The page you're searching for might have been moved, renamed, or temporarily unavailable. Let's get you back to where the creative work happens.
    </p>

    <div style="display: flex; gap: 16px; flex-wrap: wrap; justify-content: center;">
      <a href="index.html" class="btn btn-primary">
        Return to Homepage &rarr;
      </a>
      <a href="index.html#contact" class="btn btn-secondary">
        Contact Support
      </a>
    </div>
  </div>
</body>
</html>
